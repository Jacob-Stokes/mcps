name: Build images

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.find.outputs.services }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: find
        run: |
          # Any top-level dir with a Dockerfile is a candidate service.
          # Top-level source-only libraries (mcp-common) are intentionally
          # skipped — they don't ship a Dockerfile.
          all_services=$(find . -maxdepth 2 -name Dockerfile -not -path './.*' \
            | sed -E 's|^\./||; s|/Dockerfile$||')

          # Only rebuild what actually changed, so touching one MCP doesn't
          # rebuild all ~17 of them. Exceptions that rebuild everything:
          # manual dispatch, no previous commit to diff against (first push
          # to a new branch), a change to mcp-common/ (shared dep baked into
          # every image), or a change to this workflow file itself.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || \
             [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            changed_dirs="$all_services"
          else
            changed_files=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")
            echo "Changed files:"; echo "$changed_files"

            rebuild_all=no
            echo "$changed_files" | grep -qE '^mcp-common/' && rebuild_all=yes
            echo "$changed_files" | grep -qE '^\.github/workflows/' && rebuild_all=yes

            if [ "$rebuild_all" = "yes" ]; then
              changed_dirs="$all_services"
            else
              changed_dirs=""
              for svc in $all_services; do
                if echo "$changed_files" | grep -q "^${svc}/"; then
                  changed_dirs="$changed_dirs $svc"
                fi
              done
            fi
          fi

          services=$(echo $changed_dirs | tr ' ' '\n' | grep -v '^$' | jq -R . | jq -sc . )
          services=${services:-[]}
          echo "services=$services" >> "$GITHUB_OUTPUT"
          echo "Building: $services"

  build:
    needs: discover
    if: needs.discover.outputs.services != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.discover.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          # Namespaced under `mcps/` so this repo's images don't collide with
          # the same-named packages still owned by the legacy `source` repo.
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/mcps/${{ matrix.service }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          # Build context is the monorepo root so Dockerfiles can COPY from
          # sibling directories (e.g. MCP sidecars pulling in mcp-common).
          # Each service's Dockerfile therefore prefixes its COPY paths with
          # the service name, e.g. `COPY thesys-mcp/package.json ./`.
          context: .
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          # Multi-arch: most hosts are x86_64, one host is ARM and runs
          # these images natively.
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
